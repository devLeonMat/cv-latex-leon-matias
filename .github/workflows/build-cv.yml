name: Build CV PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:    # Allow manual trigger from the GitHub UI

permissions:
  contents: write       # Required to create/update Releases

jobs:
  build:
    name: Compile LaTeX CV with XeLaTeX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile resume.tex (English — General)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error -shell-escape"

      - name: Compile resume-es.tex (Spanish — General)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-es.tex
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error -shell-escape"

      - name: Compile resume-backend-ai.tex (English — Backend + AI Agents)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-backend-ai.tex
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error -shell-escape"

      - name: Compile resume-backend-ai-es.tex (Spanish — Backend + AI Agents)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-backend-ai-es.tex
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error -shell-escape"

      - name: Compile resume-techlead.tex (English — Tech Lead)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-techlead.tex
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error -shell-escape"

      - name: Compile resume-techlead-es.tex (Spanish — Tech Lead)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-techlead-es.tex
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error -shell-escape"

      - name: Report page count of each PDF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          for f in *.pdf; do
            echo "$f -> $(pdfinfo "$f" | awk '/^Pages:/ {print $2}') page(s)"
          done

      - name: Upload English PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-roslin-leon-matias-en
          path: resume.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Upload Spanish PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-roslin-leon-matias-es
          path: resume-es.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Upload Backend+AI English PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-roslin-leon-matias-backend-ai-en
          path: resume-backend-ai.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Upload Backend+AI Spanish PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-roslin-leon-matias-backend-ai-es
          path: resume-backend-ai-es.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Upload Tech Lead English PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-roslin-leon-matias-techlead-en
          path: resume-techlead.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Upload Tech Lead Spanish PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-roslin-leon-matias-techlead-es
          path: resume-techlead-es.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Create or update "latest" GitHub Release with all PDFs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Latest Resume — Roslin Leon Matias"
          body: |
            **Roslin Leon Matias — Senior Backend Engineer / Lead Software Engineer**

            Automatically compiled PDFs from the latest commit.

            | Version | File |
            |---------|------|
            | English — General | resume.pdf |
            | Español — General | resume-es.pdf |
            | English — Backend · Java · Node.js · AI Agents | resume-backend-ai.pdf |
            | Español — Backend · Java · Node.js · Agentes IA | resume-backend-ai-es.pdf |
            | English — Tech Lead | resume-techlead.pdf |
            | Español — Tech Lead | resume-techlead-es.pdf |

            - Commit: `${{ github.sha }}`
            - Build: `${{ github.run_id }}`
            - Compiled with: XeLaTeX
          artifacts: "resume.pdf,resume-es.pdf,resume-backend-ai.pdf,resume-backend-ai-es.pdf,resume-techlead.pdf,resume-techlead-es.pdf"
          artifactContentType: "application/pdf"
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
